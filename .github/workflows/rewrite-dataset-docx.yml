name: Rewrite dataset DOCX voice

on:
  push:
    branches: [main]
    paths:
      - "src/rewrite_dataset_docx_voice.py"
      - ".github/workflows/rewrite-dataset-docx.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install python-docx
        run: pip install python-docx

      - name: Rewrite dataset documentation
        run: python src/rewrite_dataset_docx_voice.py

      - name: Commit DOCX if changed
        run: |
          if git diff --quiet -- docs/SmartQ_100k_Synthetic_Dataset_Documentation.docx; then
            echo "No DOCX changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/SmartQ_100k_Synthetic_Dataset_Documentation.docx
          git commit -m "Rewrite dataset documentation in first person"
          git push
