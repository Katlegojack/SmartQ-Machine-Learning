name: Rewrite embedded notebook voice

on:
  push:
    branches: [main]
    paths:
      - "src/rewrite_embedded_notebook_voice.py"
      - ".github/workflows/rewrite-embedded-notebook.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rewrite notebook narrative
        run: python src/rewrite_embedded_notebook_voice.py

      - name: Commit notebook if changed
        run: |
          if git diff --quiet -- notebooks/SmartQ_ML_100k_Embedded_Dataset.ipynb; then
            echo "No notebook changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notebooks/SmartQ_ML_100k_Embedded_Dataset.ipynb
          git commit -m "Rewrite embedded ML notebook narrative in first person"
          git push
